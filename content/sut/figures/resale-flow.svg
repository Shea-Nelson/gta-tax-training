<svg class="svg-text" role="img" aria-labelledby="rsf-t rsf-d" viewBox="0 0 760 470" width="760" xmlns="http://www.w3.org/2000/svg">
<title id="rsf-t">How a sale for resale is documented and what happens next</title>
<desc id="rsf-d">Step 1: a registered buyer gives the seller a copy of its current Annual Resale Certificate or its certificate number. Step 2: the seller documents the exempt sale using one of three methods: method 1, keep a paper or electronic copy of the current certificate for three years; method 2, get a transaction authorization number for this sale; method 3, get an annual vendor authorization number for this customer for the calendar year. Step 3: the sale is exempt. Step 4: the buyer either resells the item and collects tax from its own customer, or uses the item itself and must report use tax.</desc>
<defs><marker id="arr3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#051a54"/></marker></defs>
<g font-size="15" fill="#1f1f1f">
<rect x="180" y="10" width="400" height="56" rx="6" fill="#fff" stroke="#051a54" stroke-width="2"/>
<text x="380" y="34" text-anchor="middle" font-weight="700" fill="#051a54">1. Buyer gives the seller its current DR-13</text>
<text x="380" y="54" text-anchor="middle">(paper or electronic copy, or the certificate number)</text>
<line x1="380" y1="66" x2="380" y2="96" stroke="#051a54" stroke-width="3" marker-end="url(#arr3)"/>
<text x="380" y="118" text-anchor="middle" font-weight="700" fill="#051a54">2. Seller documents the sale with any one method</text>
<rect x="10" y="130" width="236" height="104" rx="6" fill="#e8f4f3" stroke="#00695f" stroke-width="2"/>
<text x="128" y="154" text-anchor="middle" font-weight="700">Method 1</text>
<text x="128" y="176" text-anchor="middle">Keep a copy of the</text><text x="128" y="196" text-anchor="middle">customer's current</text><text x="128" y="216" text-anchor="middle">certificate for 3 years</text>
<rect x="262" y="130" width="236" height="104" rx="6" fill="#e8f4f3" stroke="#00695f" stroke-width="2"/>
<text x="380" y="154" text-anchor="middle" font-weight="700">Method 2</text>
<text x="380" y="176" text-anchor="middle">Get a transaction</text><text x="380" y="196" text-anchor="middle">authorization number</text><text x="380" y="216" text-anchor="middle">for this one sale</text>
<rect x="514" y="130" width="236" height="104" rx="6" fill="#e8f4f3" stroke="#00695f" stroke-width="2"/>
<text x="632" y="154" text-anchor="middle" font-weight="700">Method 3</text>
<text x="632" y="176" text-anchor="middle">Get an annual vendor</text><text x="632" y="196" text-anchor="middle">authorization number</text><text x="632" y="216" text-anchor="middle">per customer per year</text>
<line x1="380" y1="234" x2="380" y2="264" stroke="#051a54" stroke-width="3" marker-end="url(#arr3)"/>
<rect x="230" y="266" width="300" height="44" rx="22" fill="#051a54"/>
<text x="380" y="294" text-anchor="middle" fill="#fff" font-weight="700">3. The sale is exempt</text>
<line x1="330" y1="310" x2="200" y2="356" stroke="#051a54" stroke-width="3" marker-end="url(#arr3)"/>
<line x1="430" y1="310" x2="560" y2="356" stroke="#051a54" stroke-width="3" marker-end="url(#arr3)"/>
<rect x="40" y="358" width="300" height="84" rx="6" fill="#fff" stroke="#051a54" stroke-width="2"/>
<text x="190" y="382" text-anchor="middle" font-weight="700" fill="#051a54">4a. Buyer resells it</text>
<text x="190" y="404" text-anchor="middle">and collects tax from</text><text x="190" y="424" text-anchor="middle">its own customer</text>
<rect x="420" y="358" width="300" height="84" rx="6" fill="#fff6d6" stroke="#8a6a00" stroke-width="2"/>
<text x="570" y="382" text-anchor="middle" font-weight="700" fill="#4d3b00">4b. Buyer uses it instead</text>
<text x="570" y="404" text-anchor="middle">and must report and pay</text><text x="570" y="424" text-anchor="middle">use tax on it</text>
<text x="380" y="462" text-anchor="middle" font-size="13" fill="#4a4a4a">Sources: Annual Resale Certificate webpage; GT-300015.</text>
</g>
</svg>
