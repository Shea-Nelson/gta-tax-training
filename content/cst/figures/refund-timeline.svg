<svg class="svg-text" role="img" aria-labelledby="rt-t rt-d" viewBox="0 0 760 330" width="760" xmlns="http://www.w3.org/2000/svg">
<title id="rt-t">The customer refund procedure for overcollected CST</title>
<desc id="rt-d">A two-path flow. A customer who believes tax was overcharged sends the dealer a written request within 3 years after paying. Path A: within 30 days the dealer decides the tax was not due, and refunds or credits it within 45 days after deciding. Path B: if the dealer does not agree, within 30 days it sends the request to the Department, which decides within 90 days; if the Department finds the tax was not due, the dealer refunds or credits it within 45 days after the Department's notice. This procedure is the customer's only remedy; a lawsuit must be filed within 180 days after the dealer's written response.</desc>
<defs><marker id="rt-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#051a54"/></marker></defs>
<g font-size="14" fill="#1f1f1f">
<rect x="10" y="120" width="190" height="90" rx="8" fill="#e6e6e6" stroke="#4a4a4a"/>
<text x="105" y="148" text-anchor="middle" font-weight="700">Customer</text><text x="105" y="170" text-anchor="middle">written request</text><text x="105" y="190" text-anchor="middle">within 3 years</text>
<rect x="265" y="30" width="215" height="90" rx="8" fill="#e8f4f3" stroke="#00695f"/>
<text x="372" y="56" text-anchor="middle" font-weight="700">A. Dealer agrees</text><text x="372" y="78" text-anchor="middle">decides within 30 days</text><text x="372" y="98" text-anchor="middle">refunds within 45 days</text>
<rect x="265" y="200" width="215" height="90" rx="8" fill="#e8f4f3" stroke="#00695f"/>
<text x="372" y="226" text-anchor="middle" font-weight="700">B. Dealer disagrees</text><text x="372" y="248" text-anchor="middle">forwards to DOR</text><text x="372" y="268" text-anchor="middle">within 30 days</text>
<rect x="545" y="200" width="205" height="90" rx="8" fill="#e7ebf5" stroke="#051a54"/>
<text x="647" y="226" text-anchor="middle" font-weight="700">DOR decides</text><text x="647" y="248" text-anchor="middle">within 90 days; dealer</text><text x="647" y="268" text-anchor="middle">refunds within 45 days</text>
<g stroke="#051a54" stroke-width="3"><line x1="200" y1="150" x2="260" y2="80" marker-end="url(#rt-a)"/><line x1="200" y1="180" x2="260" y2="240" marker-end="url(#rt-a)"/><line x1="480" y1="245" x2="540" y2="245" marker-end="url(#rt-a)"/></g>
<text x="545" y="60" font-size="13">Only remedy. Any lawsuit:</text><text x="545" y="80" font-size="13">within 180 days after the</text><text x="545" y="100" font-size="13">dealer's written response.</text>
</g></svg>
